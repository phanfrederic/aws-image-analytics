AWSTemplateFormatVersion: "2010-09-09"
Description: "TBD"

Resources:
  LambdaEventSourceMapping:
    Properties:
      EventSourceArn: !GetAtt SqsQueue.Arn
      FunctionName: !Ref LambdaFunction
    Type: "AWS::Lambda::EventSourceMapping"

  LambdaFunction:
    Properties:
      Code: 
        ZipFile: |
          import boto3
          
          s3 = boto3.resource("s3")
          for bucket in s3.buckets.all():
            print(bucket.name)
      Role:
      Runtime: "python3.14"
      Timeout: 900
    Type: "AWS::Lambda::Function"

  S3Bucket:
    DependsOn: SqsQueuePolicy
    Properties:
      # BucketName: "ex-buck-fred"
      NotificationConfiguration:
        QueueConfigurations: 
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: "suffix"
                    Value: ".jpg"
            Queue: !GetAtt SqsQueue.Arn
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: "suffix"
                    Value: ".png"
            Queue: !GetAtt SqsQueue.Arn
    Type: "AWS::S3::Bucket"
  
  SqsQueue:
    # Properties: 
      # FifoQueue: true
      # QueueName: "test-fred.fifo"
    Type: "AWS::SQS::Queue"

  SqsQueuePolicy:
    Properties: 
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          Action: 
            - "SQS:SendMessage"
          Condition:
            ArnLike:
              aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::*s3bucket*"
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
          Effect: "Allow"
          Principal:
            Service: "s3.amazonaws.com"
          Resource: !GetAtt SqsQueue.Arn
      Queues: 
        - !Ref SqsQueue
    Type: "AWS::SQS::QueuePolicy"