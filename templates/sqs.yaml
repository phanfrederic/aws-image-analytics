AWSTemplateFormatVersion: "2010-09-09"

Outputs:
  SqsQueueArn: 
    Value: !GetAtt SqsQueue.Arn

Parameters:
  RedrivePolicyMaxReceiveCount:
    Type: "Number"
  VisibilityTimeout:
    Type: "Number"

Resources:
  DlqQueue:
    Type: "AWS::SQS::Queue"

  SqsQueue:
    Properties:
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DlqQueue.Arn
        maxReceiveCount: !Ref RedrivePolicyMaxReceiveCount
      VisibilityTimeout: !Ref VisibilityTimeout
    Type: "AWS::SQS::Queue"

  SqsQueuePolicy:
    Properties:
      PolicyDocument:
        Statement:
          Action: 
            - "SQS:SendMessage"
          Condition:
            ArnLike:
              aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::*s3bucket*"
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
          Effect: "Allow"
          Principal:
            Service: "s3.amazonaws.com"
          Resource: !GetAtt SqsQueue.Arn
        Version: "2012-10-17"
      Queues: 
        - !Ref SqsQueue
    Type: "AWS::SQS::QueuePolicy"
