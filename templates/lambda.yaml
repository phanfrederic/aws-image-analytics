AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  DynamoDbTableArn:
    Type: String
  S3BucketArn:
    Type: String
  S3BucketName:
    Type: String
  SqsQueueArn:
    Type: String

Resources:
  IamRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Action:
            - "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service:
              - "lambda.amazonaws.com"
        Version: "2012-10-17"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyDocument:
            Statement:
              - Action: 
                  - "dynamodb:PutItem"
                Effect: "Allow"
                Resource:
                  - !Ref DynamoDbTableArn
              - Action:
                  - "s3:GetObject"
                Effect: "Allow"
                Resource:
                  - !Sub "${S3BucketArn}/*"
              - Action:
                  - "sqs:DeleteMessage"
                  - "sqs:GetQueueAttributes"
                  - "sqs:ReceiveMessage"
                Effect: "Allow"
                Resource:
                  - !Ref SqsQueueArn
              - Action:
                  - "rekognition:DetectLabels"
                Effect: "Allow"
                Resource: "*"
            Version: "2012-10-17"
          PolicyName: "LambdaS3SqsAccessPolicy"
    Type: "AWS::IAM::Role"

  LambdaEventSourceMapping:
    Properties:
      EventSourceArn: !Ref SqsQueueArn
      FunctionName: !Ref LambdaFunction
    Type: "AWS::Lambda::EventSourceMapping"

  LambdaFunction:
    Properties:
      Code: 
        ZipFile: |
          import boto3
          import json
          import urllib

          def handler(event, context):
            rekognition_client = boto3.client("rekognition")

            for sqs_record in event.get("Records", []):
              s3_event = json.loads(sqs_record["body"])

              for s3_record in s3_event.get("Records", []):
                bucket_name = s3_record["s3"]["bucket"]["name"]
                object_key = urllib.parse.unquote_plus(s3_record["s3"]["object"]["key"])

                rekognition_response = rekognition_client.detect_labels(
                  Image = {
                    "S3Object": {
                      "Bucket": bucket_name,
                      "Name": object_key
                    }
                  },
                  MaxLabels = 10,
                  MinConfidence = 80
                )

            return {'statusCode': 200}
      Handler: "index.handler"
      Role: !GetAtt IamRole.Arn
      Runtime: "python3.14"
      Timeout: 60
    Type: "AWS::Lambda::Function"
