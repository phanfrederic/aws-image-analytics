AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  S3BucketArn:
    Type: String
  S3BucketName:
    Type: String
  SqsQueueArn:
    Type: String

Resources:
  IamRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Action:
            - "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service:
              - "lambda.amazonaws.com"
        Version: "2012-10-17"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - "s3:GetObject"
                Effect: "Allow"
                Resource:
                  - !Ref S3BucketArn
              - Action:
                  - "sqs:DeleteMessage"
                  - "sqs:GetQueueAttributes"
                  - "sqs:ReceiveMessage"
                Effect: "Allow"
                Resource:
                  - !Ref SqsQueueArn
              - Action:
                  - "rekognition:DetectLabels"
                Effect: "Allow"
                Resource: "*"
            Version: "2012-10-17"
          PolicyName: "LambdaS3SqsAccessPolicy"
    Type: "AWS::IAM::Role"

  LambdaEventSourceMapping:
    Properties:
      EventSourceArn: !Ref SqsQueueArn
      FunctionName: !Ref LambdaFunction
    Type: "AWS::Lambda::EventSourceMapping"

  LambdaFunction:
    Properties:
      Code: 
        ZipFile: |
          import boto3
          import os

          def handler(event, context):
            
            rekognition = boto3.client("rekognition")
            s3 = boto3.resource("s3")

            for record in event.get("Records", []):
              body = json.loads(record["body"])

              for record2 in body.get("Records", []):
                bucket = record["s3"]["bucket"]["name"]
                key = record["s3"]["object"]["key"]
                reko_response = rekognition.detect_labels(
                  Image = {
                    "S3Object": {
                      "Bucket": bucket,
                      "Name": key
                    }
                  },
                  MaxLabels = 10,
                  MinConfidence = 75
                )
                print(reko_response)

      # Environment:
      #   Variables:
      #     BUCKET_NAME: !Ref S3BucketName
      Handler: "index.handler"
      Role: !GetAtt IamRole.Arn
      Runtime: "python3.14"
      Timeout: 60
    Type: "AWS::Lambda::Function"
