AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  DynamoDbTableArn:
    Type: String
  DynamoDbTableName:
    Type: String
  S3BucketArn:
    Type: String
  S3BucketName:
    Type: String
  SqsQueueArn:
    Type: String
  
  Runtime:
    Type: "String"
  Timeout:
    Type: "Number"
  MaxLabels:
    Type: "Number"
  MinConfidence:
    Type: "Number"

Resources:
  IamRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Action:
            - "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service:
              - "lambda.amazonaws.com"
        Version: "2012-10-17"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyDocument:
            Statement:
              - Action: 
                  - "dynamodb:PutItem"
                Effect: "Allow"
                Resource:
                  - !Ref DynamoDbTableArn
              - Action:
                  - "s3:GetObject"
                Effect: "Allow"
                Resource:
                  - !Sub "${S3BucketArn}/*"
              - Action:
                  - "sqs:DeleteMessage"
                  - "sqs:GetQueueAttributes"
                  - "sqs:ReceiveMessage"
                Effect: "Allow"
                Resource:
                  - !Ref SqsQueueArn
              - Action:
                  - "rekognition:DetectLabels"
                Effect: "Allow"
                Resource: "*"
            Version: "2012-10-17"
          PolicyName: "LambdaS3SqsAccessPolicy"
    Type: "AWS::IAM::Role"

  LambdaEventSourceMapping:
    Properties:
      EventSourceArn: !Ref SqsQueueArn
      FunctionName: !Ref LambdaFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures
    Type: "AWS::Lambda::EventSourceMapping"

  LambdaFunction:
    Properties:
      Code: 
        ZipFile: |
          import boto3
          import datetime
          import decimal
          import json
          import os
          import urllib

          dynamodb_client = boto3.resource("dynamodb")
          dynamodb_table = dynamodb_client.Table(os.environ["TABLE_NAME"])
          rekognition_client = boto3.client("rekognition")

          def handler(event, context):
            item_failure_list = []

            for sqs_record in event.get("Records", []):
              try:
                s3_event = json.loads(sqs_record["body"])

                for s3_record in s3_event.get("Records", []):
                  bucket_name = s3_record["s3"]["bucket"]["name"]
                  object_key = urllib.parse.unquote_plus(s3_record["s3"]["object"]["key"])

                  rekognition_response = rekognition_client.detect_labels(
                    Image = {
                      "S3Object": {
                        "Bucket": bucket_name,
                        "Name": object_key
                      }
                    },
                    MaxLabels = os.environ["MAX_LABELS"],
                    MinConfidence = os.environ["MIN_CONFIDENCE"]
                  )

                  label_list = [
                    {
                      "LabelName": label["Name"], 
                      "LabelConfidence": decimal.Decimal(str(round(label["Confidence"], 2)))
                    } 
                    for label in rekognition_response["Labels"]
                  ]

                  dynamodb_table.put_item(
                    Item = {
                      "ObjectKey": object_key,
                      "UploadTime": datetime.datetime.now(datetime.UTC).isoformat(),
                      "ImageLabel": label_list
                    }
                  )

              except Exception as e : 
                item_failure_list.append(
                  {
                    "itemIdentifier": sqs_record["messageId"]
                  }
                )
            
            return {"batchItemFailures": item_failure_list}

      Environment:
        Variables:
          MAX_LABELS: !Ref MaxLabels
          MIN_CONFIDENCE: !Ref MinConfidence
          TABLE_NAME: !Ref DynamoDbTableName

      Handler: "index.handler"
      Role: !GetAtt IamRole.Arn
      Runtime: !Ref Runtime
      Timeout: !Ref Timeout
    Type: "AWS::Lambda::Function"
