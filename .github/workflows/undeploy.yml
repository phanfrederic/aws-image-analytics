jobs:
  prepare:
    if: "inputs.confirmation == 'undeploy'"
    outputs:
      github-workflow-configuration: ${{ steps.load-environment-configuration.outputs.workflow-configuration }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"
      
      - id: "load-environment-configuration"
        env: 
          PARAMETER_FILE_NAME: "parameters/${{ inputs.environment || 'development' }}.json"
        name: "Load environment configuration"
        run: |
          WORKFLOW_CONFIGURATION=$(jq -ce ".github_workflow_configuration" "$PARAMETER_FILE_NAME")
          echo "workflow-configuration=$WORKFLOW_CONFIGURATION" >> $GITHUB_OUTPUT

  bootstrap:
    needs: "prepare"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Configure AWS credential"
        uses: "aws-actions/configure-aws-credentials@v6"
        with:
          aws-region: "${{ fromJSON(needs.prepare.outputs.github-workflow-configuration).deployment_region_name }}"
          role-to-assume: "${{ fromJSON(needs.prepare.outputs.github-workflow-configuration).assumed_role_arn }}"

      - env:
          BOOTSTRAP_STACK_NAME: "${{ fromJSON(needs.prepare.outputs.github_workflow_configuration).bootstrap_stack_name }}"
          DEPLOY_STACK_NAME: "${{ fromJSON(needs.prepare.outputs.github_workflow_configuration).deploy_stack_name }}"
        name: "Empty S3 bucket(s)"
        run: |
          for root_stack_name in $BOOTSTRAP_STACK_NAME $DEPLOY_STACK_NAME; do
            if ! aws cloudformation describe-stacks --stack-name "$root_stack_name" > /dev/null 2>&1; then
              continue
            fi

            nested_stack_name_list=$(aws cloudformation list-stack-resources \
              --output text \
              --query "StackResourceSummaries[?ResourceType=='AWS::CloudFormation::Stack'].PhysicalResourceId" \
              --stack-name "$root_stack_name"
            )

            for stack_name in $nested_stack_name_list $root_stack_name; do
              bucket_name_list=$(aws cloudformation list-stack-resources \
                --output text \
                --query "StackResourceSummaries[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId" \
                --stack-name "$stack_name"
              )

              for bucket_name in $bucket_name_list; do
                aws s3 rm s3://$bucket_name --recursive
              done
            done
          done

  undeploy:
    needs:
      - "bootstrap" 
      - "prepare"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Configure AWS credential"
        uses: "aws-actions/configure-aws-credentials@v6"
        with:
          aws-region: "${{ fromJSON(needs.prepare.outputs.github-workflow-configuration).deployment_region_name }}"
          role-to-assume: "${{ fromJSON(needs.prepare.outputs.github-workflow-configuration).assumed_role_arn }}"
      
      - env:
          BOOTSTRAP_STACK_NAME: "${{ fromJSON(needs.prepare.outputs.github_workflow_configuration).bootstrap_stack_name }}"
          DEPLOY_STACK_NAME: "${{ fromJSON(needs.prepare.outputs.github_workflow_configuration).deploy_stack_name }}"
        name: "Undeploy CloudFormation stack(s)"
        run: |
          for root_stack_name in $BOOTSTRAP_STACK_NAME $DEPLOY_STACK_NAME; do
            if ! aws cloudformation describe-stacks --stack-name "$root_stack_name" > /dev/null 2>&1; then
              continue
            fi

            aws cloudformation delete-stack --stack-name "$root_stack_name"
            aws cloudformation wait stack-delete-complete --stack-name "$root_stack_name"
          done

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'undeploy' to confirm deleting all stack(s)"
        required: true
      environment:
        default: "development"
        description: "Choose a target deployment environment"
        options:
          - "development"
          - "production"
          - "staging"
        required: true
        type: "choice"

permissions:
  contents: "read"
  id-token: "write"
