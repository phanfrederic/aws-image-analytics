env:
  DEPLOY_STACK_NAME: "image-analytics-deploy-stack"
  PREPARE_STACK_NAME: "image-analytics-prepare-stack"

jobs:
  prepare:
    outputs:
      artifact-bucket-name: ${{ steps.get-artifact-bucket-name.outputs.artifact-bucket-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::792682046860:role/GitHubAction-AssumeRoleWithAction

      - name: Deploy artifact bucket
        run: |
          aws cloudformation deploy \
            --stack-name $PREPARE_STACK_NAME \
            --template-file ./templates/bootstrap.yaml

      - id: get-artifact-bucket-name
        name: Get artifact bucket name
        run: |
          artifact_bucket_name=$(aws cloudformation describe-stacks \
            --output text \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --stack-name $PREPARE_STACK_NAME)
          echo "artifact-bucket-name=$artifact_bucket_name" >> $GITHUB_OUTPUT

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::792682046860:role/GitHubAction-AssumeRoleWithAction

      - name: Package CloudFormation template
        run: |
          aws cloudformation package \
            --output-template-file ./packaged-main.yaml \
            --s3-bucket ${{ needs.prepare.outputs.artifact-bucket-name }} \
            --template-file ./main.yaml

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --capabilities CAPABILITY_NAMED_IAM \
            --stack-name $DEPLOY_STACK_NAME \
            --template-file ./packaged-main.yaml

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
