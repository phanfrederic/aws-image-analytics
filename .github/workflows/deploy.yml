name: AWS example workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v7


      - name: Debug OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .


      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::792682046860:role/GitHubAction-AssumeRoleWithAction

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --capabilities CAPABILITY_NAMED_IAM \
            --stack-name image-stack \
            --template-file cfn.yaml
