jobs:
  prepare:
    outputs:
      cloudformation-stack-parameter: ${{ steps.load-environment-configuration.outputs.stack-parameter }}
      github-environment-configuration: ${{ steps.load-environment-configuration.outputs.workflow-configuration }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - id: "load-environment-configuration"
        env:
          PARAMETER_FILE_FORMAT: "{ParameterKey: .key, ParameterValue: .value}"
          PARAMETER_FILE_NAME: "parameters/${{ inputs.environment || 'development' }}.json"
        name: "Load environment configuration"
        run: |
          echo "stack-parameter=$(jq -ce '[.cloudformation_stack_parameter | to_entries[] | $PARAMETER_FILE_FORMAT]' $PARAMETER_FILE_NAME | base64 -w 0)" >> $GITHUB_OUTPUT
          echo "workflow-configuration=$(jq -ce '.github_workflow_configuration' $PARAMETER_FILE_NAME)" >> $GITHUB_OUTPUT

  bootstrap:
    needs: "prepare"
    outputs:
      artifact-bucket-name: ${{ steps.get-artifact-bucket-name.outputs.bucket-name }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Configure AWS credential"
        uses: "aws-actions/configure-aws-credentials@v6"
        with:
          aws-region: "${{ fromJSON(needs.prepare.outputs.github-environment-configuration).deployment_region_name }}"
          role-to-assume: "${{ fromJSON(needs.prepare.outputs.github-environment-configuration).assumed_role_arn }}"

      - name: "Deploy artifact bucket"
        run: |
          aws cloudformation deploy \
            --stack-name ${{ fromJSON(needs.prepare.outputs.github-environment-configuration).bootstrap_stack_name }} \
            --template-file ./templates/bootstrap.yaml

      - id: "get-artifact-bucket-name"
        name: "Get artifact bucket name"
        run: |
          artifact_bucket_name=$(aws cloudformation describe-stacks \
            --output text \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --stack-name ${{ fromJSON(needs.prepare.outputs.github-environment-configuration).bootstrap_stack_name }})
          echo "bucket-name=$artifact_bucket_name" >> $GITHUB_OUTPUT

  deploy:
    needs:
      - "prepare"
      - "bootstrap"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Configure AWS credential"
        uses: "aws-actions/configure-aws-credentials@v6"
        with:
          aws-region: "${{ fromJSON(needs.prepare.outputs.github-environment-configuration).deployment_region_name }}"
          role-to-assume: "${{ fromJSON(needs.prepare.outputs.github-environment-configuration).assumed_role_arn }}"

      - name: "Create parameter file"
        run: |
          printf "${{ needs.prepare.outputs.cloudformation-stack-parameter }}" | base64 -d > cloudformation-parameter-list.json

      - name: "Package CloudFormation template"
        run: |
          aws cloudformation package \
            --output-template-file ./packaged-main.yaml \
            --s3-bucket ${{ needs.bootstrap.outputs.artifact-bucket-name }} \
            --template-file ./main.yaml

      - name: "Deploy CloudFormation stack"
        run: |
          aws cloudformation deploy \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides file://cloudformation-parameter-list.json \
            --stack-name ${{ fromJSON(needs.prepare.outputs.github-environment-configuration).deploy_stack_name }} \
            --template-file ./packaged-main.yaml

on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      environment:
        default: "development"
        description: "Choose a target deployment environment"
        options:
          - "development"
          - "production"
          - "staging"
        required: true
        type: "choice"

permissions:
  contents: "read"
  id-token: "write"
