AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  DeploymentEnvironment:
    Type: "String"
  LambdaRuntime:
    Type: "String"
  LambdaTimeout:
    Type: "Number"
  RekognitionMaxLabels:
    Type: "Number"
  RekognitionMinConfidence:
    Type: "Number"
  SqsRedrivePolicyMaxReceiveCount:
    Type: "Number"
  SqsVisibilityTimeout:
    Type: "Number"

Resources:
  DynamoDbStack:
    Properties:
      TemplateURL: "./templates/dynamodb.yaml"
    Type: "AWS::CloudFormation::Stack"

  LambdaStack:
    Properties:
      Parameters:
        DynamoDbTableArn: !GetAtt DynamoDbStack.Outputs.DynamoDbTableArn
        DynamoDbTableName: !GetAtt DynamoDbStack.Outputs.DynamoDbTableName
        S3BucketArn: !GetAtt S3Stack.Outputs.S3BucketArn
        S3BucketName: !GetAtt S3Stack.Outputs.S3BucketName
        SqsQueueArn: !GetAtt SqsStack.Outputs.SqsQueueArn
      TemplateURL: "./templates/lambda.yaml"
    Type: "AWS::CloudFormation::Stack"

  S3Stack:
    DependsOn: SqsStack
    Properties:
      Parameters:
        SqsQueueArn: !GetAtt SqsStack.Outputs.SqsQueueArn
      TemplateURL: "./templates/s3.yaml"
    Type: "AWS::CloudFormation::Stack"
  
  SqsStack:
    Properties:
      Parameters:
        RedrivePolicyMaxReceiveCount: !Ref SqsRedrivePolicyMaxReceiveCount
        VisibilityTimeout: !Ref SqsVisibilityTimeout
      TemplateURL: "./templates/sqs.yaml"
    Type: "AWS::CloudFormation::Stack"
